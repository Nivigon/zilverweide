<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zilverweide — Logboek (sessie-analyse)</title>
<!--
  Losse analysepagina, hoort NIET bij de gameplay. Open dit bestand op je
  laptop (of via de knop in het debugpaneel van het spel). Het leest de
  log-tak die het spel wegschrijft (sessies/<id>/log) plus de eindstand
  (shared) en de herstelpunten (spelers), en berekent per sessie:
    - verblijftijd per rol per locatie (waar bleef iemand lang hangen),
    - hartslag-gaten (tablet stilgevallen of speler vast),
    - sleutelmomenten (paginaload, snelstart, reset, herstel),
    - alle gedeelde schrijfacties met rol (bug-forensiek).
  Twee downloads per sessie: ruwe JSON (voor Claude) en een Markdown-
  samenvatting (voor in een map op je bureaublad).
  Alleen lezen: deze pagina schrijft nooit naar Firebase.
-->
<style>
  :root {
    --bg: #0d0a06; --panel: #160f08; --rand: rgba(201,168,76,.28);
    --goud: #c9a84c; --goud-dim: #8a7638; --parchment: #e8dcc0;
    --mist: #9a9384; --bloed: #b4553f; --groen: #6f9f5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--parchment);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  }
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--rand);
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1.05rem; margin: 0; color: var(--goud); letter-spacing: .04em; font-weight: 600; }
  header .sub { color: var(--mist); font-size: .8rem; }
  button {
    background: rgba(201,168,76,.1); color: var(--goud); border: 1px solid var(--rand);
    border-radius: 4px; padding: .4rem .7rem; cursor: pointer; font-size: .8rem; font-family: inherit;
  }
  button:hover { background: rgba(201,168,76,.2); }
  .layout { display: flex; min-height: calc(100vh - 60px); }
  .sessies { width: 240px; border-right: 1px solid var(--rand); padding: .75rem; overflow-y: auto; flex-shrink: 0; }
  .sessie-item {
    padding: .5rem .6rem; border: 1px solid transparent; border-radius: 4px; cursor: pointer;
    margin-bottom: .35rem; font-size: .82rem;
  }
  .sessie-item:hover { background: rgba(201,168,76,.07); }
  .sessie-item.actief { background: rgba(201,168,76,.14); border-color: var(--rand); }
  .sessie-item .naam { color: var(--goud); font-weight: 600; }
  .sessie-item .meta { color: var(--mist); font-size: .72rem; }
  .sessie-item.dim .naam { color: var(--goud-dim); font-weight: 400; }
  .groep-kop {
    color: var(--goud-dim); font-size: .68rem; text-transform: uppercase;
    letter-spacing: .12em; padding: .6rem .6rem .25rem; border-top: 1px solid rgba(201,168,76,.12);
    margin-top: .5rem;
  }
  .groep-kop:first-child { border-top: none; margin-top: 0; padding-top: .1rem; }
  .detail { flex: 1; padding: 1.25rem; overflow-y: auto; }
  .kaart { background: var(--panel); border: 1px solid var(--rand); border-radius: 6px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .kaart h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--goud-dim); margin: 0 0 .75rem; }
  .rij { display: flex; gap: .5rem; align-items: baseline; padding: .15rem 0; }
  .rij .rol { display: inline-block; min-width: 3.2rem; color: var(--goud); font-weight: 600; }
  .rij .tijd { color: var(--mist); font-variant-numeric: tabular-nums; font-size: .78rem; min-width: 4.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid rgba(201,168,76,.1); vertical-align: top; }
  th { color: var(--goud-dim); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--mist); }
  .tag { display: inline-block; padding: .05rem .4rem; border-radius: 3px; font-size: .72rem; font-weight: 600; }
  .tag.reset { background: rgba(180,85,63,.22); color: var(--bloed); }
  .tag.team { background: rgba(201,168,76,.18); color: var(--goud); }
  .tag.snelstart { background: rgba(180,85,63,.15); color: var(--bloed); }
  .tag.herstel { background: rgba(111,159,91,.18); color: var(--groen); }
  .tag.paginaload { background: rgba(154,147,132,.15); color: var(--mist); }
  .tag.gat { background: rgba(180,85,63,.22); color: var(--bloed); }
  .tag.goed { background: rgba(111,159,91,.18); color: var(--groen); }
  .tag.fout { background: rgba(180,85,63,.22); color: var(--bloed); }
  .balk-rij { display: flex; align-items: center; gap: .5rem; padding: .12rem 0; }
  .balk-naam { min-width: 11rem; font-size: .8rem; }
  .balk-buiten { flex: 1; background: rgba(201,168,76,.08); border-radius: 3px; height: 14px; overflow: hidden; }
  .balk-binnen { height: 100%; background: linear-gradient(90deg, var(--goud-dim), var(--goud)); }
  .balk-tijd { min-width: 4.5rem; text-align: right; color: var(--mist); font-variant-numeric: tabular-nums; font-size: .78rem; }
  .leeg { color: var(--mist); font-style: italic; padding: 2rem 1rem; text-align: center; }
  .foutmelding { color: var(--bloed); padding: 1rem; }
  .download-rij { display: flex; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .rol-blok { margin-bottom: .9rem; }
  .rol-blok h3 { font-size: .82rem; color: var(--goud); margin: 0 0 .3rem; }
  code { color: var(--parchment); background: rgba(201,168,76,.08); padding: .05rem .3rem; border-radius: 3px; font-size: .78rem; }
</style>
</head>
<body>
<header>
  <h1>Zilverweide — Logboek</h1>
  <span class="sub" id="kop-status">laden...</span>
  <button onclick="laadAlles()" style="margin-left:auto">Vernieuwen</button>
</header>
<div class="layout">
  <div class="sessies" id="sessie-lijst"><div class="leeg">laden...</div></div>
  <div class="detail" id="detail"><div class="leeg">Kies links een sessie.</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Zelfde project als het spel. Alleen-lezen gebruik.
firebase.initializeApp({
  apiKey: "AIzaSyCihbRjcetrfc1n2GWDi6243JUao00Uhh8",
  databaseURL: "https://zilverweide-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zilverweide"
});

// Drempels voor de analyse.
var GAT_MS = 90 * 1000;        // hartslag-gat: >90s zonder teken van leven
var DWELL_CAP_MS = 5 * 60 * 1000; // een enkel gat telt hooguit 5 min mee als verblijftijd

var _sessies = {};   // ruwe data per sessie-id
var _gekozen = null;

function tijdStr(t) {
  if (!t) return '--:--:--';
  try { return new Date(t).toLocaleTimeString('nl-NL'); } catch (e) { return String(t); }
}
function datumStr(t) {
  if (!t) return 'onbekend';
  try { return new Date(t).toLocaleString('nl-NL'); } catch (e) { return String(t); }
}
function duurStr(ms) {
  if (!ms || ms < 0) return '0s';
  var s = Math.round(ms / 1000);
  var m = Math.floor(s / 60); s = s % 60;
  var u = Math.floor(m / 60); m = m % 60;
  if (u > 0) return u + 'u ' + m + 'm';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; });
}

// Zet de log-tak (object van pushId->entry) om in een op tijd gesorteerde lijst.
function logLijst(sessie) {
  var log = sessie && sessie.log;
  if (!log) return [];
  var arr = [];
  for (var k in log) { if (log.hasOwnProperty(k)) arr.push(log[k]); }
  arr.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
  return arr;
}

// Bereken alles wat we per sessie willen tonen.
function analyse(sessie) {
  var entries = logLijst(sessie);
  var res = {
    start: entries.length ? entries[0].t : null,
    eind: entries.length ? entries[entries.length - 1].t : null,
    events: [],           // sleutelmomenten
    shared: [],           // gedeelde schrijfacties
    gokken: [],           // heks-gokken op het podium (type 'gok')
    dwellPerRol: {},      // rol -> {locatie -> ms}
    gatenPerRol: {},      // rol -> [{van, tot, ms}]
    rollen: {}            // set van rollen
  };
  // Per rol de op tijd gesorteerde "teken van leven"-monsters (scherm/hartslag),
  // voor verblijftijd en gaten.
  var levenPerRol = {};
  entries.forEach(function (e) {
    var rol = e.rol || '?';
    if (rol !== '?') res.rollen[rol] = true;
    if (e.type === 'sessie') {
      res.events.push(e);
    } else if (e.type === 'shared') {
      res.shared.push(e);
    } else if (e.type === 'gok') {
      res.gokken.push(e);
    }
    if (e.type === 'scherm' || e.type === 'hartslag') {
      if (!levenPerRol[rol]) levenPerRol[rol] = [];
      levenPerRol[rol].push(e);
    }
  });
  // Verblijftijd + gaten per rol.
  for (var rol in levenPerRol) {
    var lijst = levenPerRol[rol];
    var dwell = {};
    var gaten = [];
    for (var i = 0; i < lijst.length - 1; i++) {
      var a = lijst[i], b = lijst[i + 1];
      var gap = (b.t || 0) - (a.t || 0);
      if (gap <= 0) continue;
      // Waar was de speler in dit interval? Locatie indien bekend, anders scherm.
      var plek = a.locatie || a.scherm || 'onbekend';
      dwell[plek] = (dwell[plek] || 0) + Math.min(gap, DWELL_CAP_MS);
      if (gap > GAT_MS) gaten.push({ van: a.t, tot: b.t, ms: gap });
    }
    res.dwellPerRol[rol] = dwell;
    res.gatenPerRol[rol] = gaten;
  }
  // Teamnaam en oplostijd (uit meta en de gedeelde stand).
  var meta = sessie && sessie.meta;
  var shared = sessie && sessie.shared;
  res.team = (meta && meta.team) || null;
  res.slug = (meta && meta.slug) || null;
  res.aangemaakt = (meta && meta.aangemaakt) || res.start;
  // Speelsessie of test? Een echte speelronde heeft een gekozen teamnaam
  // (meta, of het team_gekozen-moment in de log). Al het andere, snelstarts
  // via het testpaneel, losse paginaloads, naamscherm-snippers in oude
  // sessie-ids, telt als test/overig en komt in de tweede groep terecht.
  res.teamGekozen = !!res.team;
  res.events.forEach(function (e) {
    if (e.actie === 'team_gekozen') {
      res.teamGekozen = true;
      if (!res.team && e.team) res.team = e.team;
    }
  });
  res.teamStart = (shared && shared.team_start) || null;
  res.teamEind = (shared && shared.team_eind) || null;
  res.oplostijd = (res.teamStart && res.teamEind) ? (res.teamEind - res.teamStart) : null;
  return res;
}

// Weergavenamen voor de heks-gokken. De keys komen uit de gok-telemetrie
// in het spel (logboekSchrijf('gok', ...)); onbekende waarden vallen terug
// op de ruwe code, zodat toekomstige blokken of verdachten niet stil
// wegvallen uit het overzicht.
var GOK_BLOK_NAMEN = {
  kraaienkwartier: 'Kraaienkwartier',
  dorendael: 'Dorendael',
  heerdonatuslaan: 'Heer Donatuslaan'
};
var GOK_KEUZE_NAMEN = {
  robbie: 'Robbie Kweekel', madeleine: 'Madeleine', stoop: 'Stoop',
  wallingen: 'Mevr. van Wallingen', man7: 'De Man van Nummer 7',
  bart: 'Bart', trijn10: 'Trijn', merel: 'Merel', schim: 'De Schim',
  strix: 'Strix (de kikker)', priscilla: 'De Non',
  tobbe: 'Tobbe', burgemeester: 'De Burgemeester',
  slager: 'Slager Verstilt', roet: 'Vrouwe Roet', apotheker: 'De Apotheker'
};
function gokBlokNaam(k) { return GOK_BLOK_NAMEN[k] || k || '?'; }
function gokKeuzeNaam(k) { return GOK_KEUZE_NAMEN[k] || k || '?'; }

function eventTag(actie) {
  var soort = 'paginaload';
  if (actie === 'reset_testmodus' || actie === 'reset_firebase') soort = 'reset';
  else if (actie === 'snelstart') soort = 'snelstart';
  else if (actie === 'herstel') soort = 'herstel';
  else if (actie === 'team_gekozen') soort = 'team';
  return '<span class="tag ' + soort + '">' + esc(actie) + '</span>';
}

function eventTekst(e) {
  var t = esc(e.actie || '');
  if (e.actie === 'snelstart') t += ' (' + esc(e.doelrol) + (e.reset ? ', reset' : ', geen reset') + ')';
  if (e.actie === 'herstel') t += ' (' + esc(e.doelrol) + ')';
  if (e.actie === 'paginaload' && e.versie != null) t += ' (v' + esc(e.versie) + ')';
  if (e.actie === 'team_gekozen' && e.team) t += ' (' + esc(e.team) + ')';
  if (e.actie === 'reset_firebase') t += ' (gedeelde stand gewist, log bewaard)';
  return t;
}

function renderDetail(id) {
  var sessie = _sessies[id];
  var d = document.getElementById('detail');
  if (!sessie) { d.innerHTML = '<div class="leeg">Sessie niet gevonden.</div>'; return; }
  var a = analyse(sessie);
  var rollen = Object.keys(a.rollen).sort();
  var html = '';

  // Kop + downloads
  html += '<div class="download-rij">';
  html += '<button onclick="downloadJson(\'' + esc(id) + '\')">Download JSON</button>';
  html += '<button onclick="downloadMd(\'' + esc(id) + '\')">Download Markdown</button>';
  html += '</div>';

  // Samenvatting
  html += '<div class="kaart"><h2>' + esc(a.team || id) + '</h2>';
  if (a.team) html += '<div class="rij"><span class="tijd">team</span>' + esc(a.team) + '</div>';
  html += '<div class="rij"><span class="tijd">sessie-id</span><code>' + esc(id) + '</code></div>';
  html += '<div class="rij"><span class="tijd">start</span>' + esc(datumStr(a.start)) + '</div>';
  html += '<div class="rij"><span class="tijd">eind</span>' + esc(datumStr(a.eind)) + '</div>';
  html += '<div class="rij"><span class="tijd">duur</span>' + esc(duurStr((a.eind || 0) - (a.start || 0))) + '</div>';
  if (a.oplostijd != null) {
    html += '<div class="rij"><span class="tijd">oplostijd</span><strong style="color:var(--goud)">' + esc(duurStr(a.oplostijd)) + '</strong> <span style="color:var(--mist)">(van vier gekozen tot slotscene)</span></div>';
  }
  html += '<div class="rij"><span class="tijd">rollen</span>' + (rollen.length ? esc(rollen.join(', ')) : 'geen') + '</div>';
  html += '</div>';

  // Sleutelmomenten
  html += '<div class="kaart"><h2>Sleutelmomenten</h2>';
  if (!a.events.length) { html += '<div class="leeg" style="padding:.5rem">geen</div>'; }
  else {
    a.events.forEach(function (e) {
      html += '<div class="rij"><span class="tijd">' + esc(tijdStr(e.t)) + '</span>' +
        '<span class="rol">' + esc(e.rol) + '</span>' + eventTag(e.actie) +
        ' <span>' + eventTekst(e) + '</span></div>';
    });
  }
  html += '</div>';

  // Heks-gokken: per straat wie het stemrecht gebruikte, wat er werd
  // aangewezen en hoe vaak het misging. Gevoed door de gok-telemetrie.
  html += '<div class="kaart"><h2>Heks-gokken (' + a.gokken.length + ')</h2>';
  if (!a.gokken.length) {
    html += '<div class="leeg" style="padding:.5rem">geen gokken gelogd (sessie van voor deze telemetrie, of nog niet zover)</div>';
  } else {
    var gokBlokken = Object.keys(GOK_BLOK_NAMEN);
    a.gokken.forEach(function (e) {
      var b = e.blok || '?';
      if (gokBlokken.indexOf(b) === -1) gokBlokken.push(b);
    });
    gokBlokken.forEach(function (b) {
      var rijen = a.gokken.filter(function (e) { return (e.blok || '?') === b; });
      if (!rijen.length) return;
      var fout = rijen.filter(function (e) { return !e.goed; }).length;
      var samenvatting = rijen.length + (rijen.length === 1 ? ' poging' : ' pogingen') + ', ' + fout + ' fout';
      if (rijen.length > 1) {
        samenvatting += ', ' + duurStr((rijen[rijen.length - 1].t || 0) - (rijen[0].t || 0)) + ' van eerste tot laatste poging';
      }
      html += '<div class="rol-blok"><h3>' + esc(gokBlokNaam(b)) + '</h3>';
      html += '<div style="color:var(--mist);font-size:.78rem;margin:.15rem 0 .4rem">' + esc(samenvatting) + '</div>';
      html += '<table><thead><tr><th>tijd</th><th>rol</th><th>keuze</th><th>uitslag</th></tr></thead><tbody>';
      rijen.forEach(function (e) {
        html += '<tr><td class="num">' + esc(tijdStr(e.t)) + '</td><td>' + esc(e.rol) +
          '</td><td>' + esc(gokKeuzeNaam(e.keuze)) + '</td><td>' +
          (e.goed ? '<span class="tag goed">juist</span>' : '<span class="tag fout">fout</span>') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    });
  }
  html += '</div>';

  // Verblijftijd per rol
  html += '<div class="kaart"><h2>Verblijftijd per rol (waar bleef men lang?)</h2>';
  if (!rollen.length) { html += '<div class="leeg" style="padding:.5rem">geen data</div>'; }
  rollen.forEach(function (rol) {
    var dwell = a.dwellPerRol[rol] || {};
    var plekken = Object.keys(dwell).sort(function (x, y) { return dwell[y] - dwell[x]; });
    if (!plekken.length) return;
    var max = dwell[plekken[0]] || 1;
    html += '<div class="rol-blok"><h3>' + esc(rol) + '</h3>';
    plekken.slice(0, 12).forEach(function (p) {
      var pct = Math.round((dwell[p] / max) * 100);
      html += '<div class="balk-rij"><span class="balk-naam">' + esc(p) + '</span>' +
        '<span class="balk-buiten"><span class="balk-binnen" style="width:' + pct + '%"></span></span>' +
        '<span class="balk-tijd">' + esc(duurStr(dwell[p])) + '</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';

  // Hartslag-gaten
  html += '<div class="kaart"><h2>Hartslag-gaten (tablet stil of speler vast)</h2>';
  var enigGat = false;
  rollen.forEach(function (rol) {
    var gaten = a.gatenPerRol[rol] || [];
    if (!gaten.length) return;
    enigGat = true;
    html += '<div class="rol-blok"><h3>' + esc(rol) + '</h3>';
    gaten.forEach(function (g) {
      html += '<div class="rij"><span class="tijd">' + esc(tijdStr(g.van)) + '</span>' +
        '<span class="tag gat">' + esc(duurStr(g.ms)) + ' stil</span>' +
        ' <span style="color:var(--mist)">tot ' + esc(tijdStr(g.tot)) + '</span></div>';
    });
    html += '</div>';
  });
  if (!enigGat) html += '<div class="leeg" style="padding:.5rem">geen gaten langer dan ' + Math.round(GAT_MS / 1000) + 's</div>';
  html += '</div>';

  // Gedeelde schrijfacties
  html += '<div class="kaart"><h2>Gedeelde schrijfacties (' + a.shared.length + ')</h2>';
  if (!a.shared.length) { html += '<div class="leeg" style="padding:.5rem">geen</div>'; }
  else {
    html += '<table><thead><tr><th>tijd</th><th>rol</th><th>key</th><th>waarde</th></tr></thead><tbody>';
    a.shared.forEach(function (e) {
      html += '<tr><td class="num">' + esc(tijdStr(e.t)) + '</td><td>' + esc(e.rol) +
        '</td><td><code>' + esc(e.key) + '</code></td><td>' + esc(JSON.stringify(e.waarde)) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  d.innerHTML = html;
}

function kies(id) {
  _gekozen = id;
  document.querySelectorAll('.sessie-item').forEach(function (el) {
    el.classList.toggle('actief', el.getAttribute('data-id') === id);
  });
  renderDetail(id);
}

function renderLijst() {
  var lijst = document.getElementById('sessie-lijst');
  var ids = Object.keys(_sessies);
  if (!ids.length) { lijst.innerHTML = '<div class="leeg">geen sessies</div>'; return; }
  // Sorteer op laatste activiteit (nieuwste boven).
  ids.sort(function (x, y) {
    var ax = analyse(_sessies[x]).eind || 0, ay = analyse(_sessies[y]).eind || 0;
    return ay - ax;
  });
  // Nummer sessies met dezelfde teamnaam op volgorde van aanmaken, zodat een
  // naam die op een dag vaker gespeeld is als "2e", "3e" te herkennen is.
  var perSlugVolgorde = {};
  Object.keys(_sessies).forEach(function (sid) {
    var aa = analyse(_sessies[sid]);
    var sleutel = aa.slug || aa.team || sid;
    (perSlugVolgorde[sleutel] = perSlugVolgorde[sleutel] || []).push({ sid: sid, t: aa.aangemaakt || aa.start || 0 });
  });
  var volgnr = {};
  Object.keys(perSlugVolgorde).forEach(function (sleutel) {
    perSlugVolgorde[sleutel].sort(function (x, y) { return (x.t || 0) - (y.t || 0); });
    perSlugVolgorde[sleutel].forEach(function (item, i) { volgnr[item.sid] = i + 1; });
  });

  function itemHtml(id, dim) {
    var a = analyse(_sessies[id]);
    var rollen = Object.keys(a.rollen).length;
    var sleutel = a.slug || a.team || id;
    var n = volgnr[id] || 1;
    var totaal = (perSlugVolgorde[sleutel] || []).length;
    var titel = a.team ? esc(a.team) + (totaal > 1 ? ' <span style="color:var(--mist)">(' + n + 'e)</span>' : '') : esc(id);
    var extra = a.oplostijd != null ? ' · opgelost in ' + esc(duurStr(a.oplostijd)) : '';
    return '<div class="sessie-item' + (dim ? ' dim' : '') + '" data-id="' + esc(id) + '" onclick="kies(\'' + esc(id) + '\')">' +
      '<div class="naam">' + titel + '</div>' +
      '<div class="meta">' + (a.start ? esc(datumStr(a.start)) : 'geen log') + '</div>' +
      '<div class="meta">' + rollen + ' rollen · ' + esc(duurStr((a.eind || 0) - (a.start || 0))) + extra + '</div>' +
      '</div>';
  }
  // Twee groepen: echte speelrondes (teamnaam gekozen) bovenaan, al het
  // andere (snelstart-tests, losse paginaloads) gedimd daaronder. Niets
  // wordt verborgen: ook snippers zijn bruikbaar bij bug-forensiek.
  var spel = ids.filter(function (id) { return analyse(_sessies[id]).teamGekozen; });
  var overig = ids.filter(function (id) { return !analyse(_sessies[id]).teamGekozen; });
  var html = '';
  if (spel.length) {
    html += '<div class="groep-kop">Speelsessies</div>';
    spel.forEach(function (id) { html += itemHtml(id, false); });
  }
  if (overig.length) {
    html += '<div class="groep-kop">Tests en overig</div>';
    overig.forEach(function (id) { html += itemHtml(id, true); });
  }
  lijst.innerHTML = html;
}

function laadAlles() {
  document.getElementById('kop-status').textContent = 'laden...';
  firebase.database().ref('sessies').once('value').then(function (snap) {
    _sessies = snap.val() || {};
    var n = Object.keys(_sessies).length;
    document.getElementById('kop-status').textContent = n + ' sessie(s) geladen';
    renderLijst();
    // Voorkeur: de sessie uit ?sessie=, anders de nieuwste speelsessie
    // (teamnaam gekozen), en pas als die er niet is de nieuwste test.
    var wens = new URLSearchParams(window.location.search).get('sessie');
    var ids = Object.keys(_sessies);
    if (wens && _sessies[wens]) kies(wens);
    else if (ids.length) {
      ids.sort(function (x, y) { return (analyse(_sessies[y]).eind || 0) - (analyse(_sessies[x]).eind || 0); });
      var eersteSpel = ids.filter(function (id) { return analyse(_sessies[id]).teamGekozen; })[0];
      kies(eersteSpel || ids[0]);
    }
  }).catch(function (e) {
    document.getElementById('kop-status').textContent = 'fout bij laden';
    document.getElementById('detail').innerHTML = '<div class="foutmelding">Kon de database niet lezen: ' + esc(e && e.message) +
      '<br><br>Controleer je internetverbinding. Deze pagina leest de publieke Firebase-database van het spel.</div>';
  });
}

function downloadBestand(naam, inhoud, type) {
  var blob = new Blob([inhoud], { type: type });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = naam;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function downloadJson(id) {
  var data = { sessie: id, opgehaald: new Date().toISOString(), inhoud: _sessies[id] };
  downloadBestand('zilverweide-' + id + '.json', JSON.stringify(data, null, 2), 'application/json');
}

function downloadMd(id) {
  var sessie = _sessies[id];
  var a = analyse(sessie);
  var rollen = Object.keys(a.rollen).sort();
  var L = [];
  L.push('# ' + (a.team || id));
  L.push('');
  if (a.team) L.push('- Team: ' + a.team);
  L.push('- Sessie-id: ' + id);
  if (a.oplostijd != null) L.push('- Oplostijd: ' + duurStr(a.oplostijd) + ' (van vier gekozen tot slotscene)');
  L.push('- Start: ' + datumStr(a.start));
  L.push('- Eind: ' + datumStr(a.eind));
  L.push('- Duur: ' + duurStr((a.eind || 0) - (a.start || 0)));
  L.push('- Rollen: ' + (rollen.join(', ') || 'geen'));
  L.push('');
  L.push('## Sleutelmomenten');
  if (!a.events.length) L.push('_geen_');
  a.events.forEach(function (e) { L.push('- ' + tijdStr(e.t) + ' ' + e.rol + ' — ' + eventTekst(e)); });
  L.push('');
  L.push('## Heks-gokken');
  if (!a.gokken.length) L.push('_geen gokken gelogd_');
  a.gokken.forEach(function (e) {
    L.push('- ' + tijdStr(e.t) + ' ' + e.rol + ' (' + gokBlokNaam(e.blok) + '): ' +
      gokKeuzeNaam(e.keuze) + (e.goed ? ', juist' : ', fout'));
  });
  L.push('');
  L.push('## Verblijftijd per rol');
  rollen.forEach(function (rol) {
    var dwell = a.dwellPerRol[rol] || {};
    var plekken = Object.keys(dwell).sort(function (x, y) { return dwell[y] - dwell[x]; });
    if (!plekken.length) return;
    L.push('### ' + rol);
    plekken.forEach(function (p) { L.push('- ' + p + ': ' + duurStr(dwell[p])); });
    L.push('');
  });
  L.push('## Hartslag-gaten');
  var enig = false;
  rollen.forEach(function (rol) {
    var gaten = a.gatenPerRol[rol] || [];
    if (!gaten.length) return;
    enig = true;
    L.push('### ' + rol);
    gaten.forEach(function (g) { L.push('- ' + tijdStr(g.van) + ' tot ' + tijdStr(g.tot) + ': ' + duurStr(g.ms) + ' stil'); });
    L.push('');
  });
  if (!enig) L.push('_geen gaten langer dan ' + Math.round(GAT_MS / 1000) + 's_');
  L.push('');
  L.push('## Gedeelde schrijfacties');
  if (!a.shared.length) L.push('_geen_');
  else {
    L.push('| tijd | rol | key | waarde |');
    L.push('| --- | --- | --- | --- |');
    a.shared.forEach(function (e) {
      L.push('| ' + tijdStr(e.t) + ' | ' + e.rol + ' | ' + e.key + ' | ' + JSON.stringify(e.waarde) + ' |');
    });
  }
  downloadBestand('zilverweide-' + id + '.md', L.join('\n'), 'text/markdown');
}

laadAlles();
</script>
